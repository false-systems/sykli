repo:
  name: sykli
  role: content-addressed evaluator for declared work graphs
  not:
  - work tracker
  - verification authority
  - agent runner
  - datastore
  - server
  - interpreter
context:
  default_budget: 8000
  important_docs:
  - README.md
  read_first: []
  safe_to_ignore: []
validation:
  replace_inferred: false
  fast: []
  strict: []
  full: []
  privileged: []
stewardship:
  auto_sweep: true
  sessions_retention_days: 7
  runs_retention_days: 14
  history_max_records: 500
boundaries:
- "Own graph parsing, validation, planning, execution, caching, and receipts; verify checks a receipt against a tree and a contract, and judges nothing else."
- "Stay a local, offline CLI: no server, network service, daemon, coordination, or agent execution. A detached run's coordinator ends with its run."
- "A container runtime and appending receipts to an external store wait until consumer repositories run v0 daily."
- "Contract growth requires a named user and a written condition for it; removed capabilities stay on the archive/delivery-production branch."
- "Anything written under .sykli/ is bounded, and the bound is stated where it is written."
