name: CI

# The repository is public, so standard hosted runners are free: the Linux
# gate and the Windows tests run on every pull request and on main. Pull
# requests are still validated locally first (`sykli run sykli.json`).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a superseded push cancels the run it replaced instead of
# both finishing on hosted minutes. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The delta plan diffs the pull request against its base commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      # Sykli's own gate runs through the Action sykli ships, so every change
      # to this repository exercises the shim. `version: source` builds this
      # checkout instead of installing a release.
      - uses: ./
        with:
          contract: sykli.json
          version: source

  # The gate above runs on Linux through the Action. This job proves the
  # crate builds and its tests pass on Windows; typed production tests are
  # Unix-only and skip themselves. macOS is the development host and is
  # covered locally.
  windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
