name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The delta plan diffs the pull request against its base commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      # Sykli's own gate runs through the Action sykli ships, so every change
      # to this repository exercises the shim. `version: source` builds this
      # checkout instead of installing a release.
      - uses: ./
        with:
          contract: sykli.json
          version: source
