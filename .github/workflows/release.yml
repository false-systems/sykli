name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package=$(cargo pkgid -p sykli)
          version=${package##*#}
          version=${version##*@}
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2; exit 1; }
      - run: cargo test --workspace --release --locked
      - run: cargo publish --package sykli --dry-run --locked

  build:
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x86_64
            file_match: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: aarch64
            file_match: ARM aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            file_match: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            file_match: arm64
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify and package
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/sykli"
          file "$binary" | grep -q "${{ matrix.file_match }}"
          if [ "${{ matrix.platform }}" = linux ]; then
            file "$binary" | grep -q "statically linked"
          fi
          "$binary" --help >/dev/null
          tar -czf "sykli-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "$(dirname "$binary")" sykli
      - uses: actions/upload-artifact@v7
        with:
          name: sykli-${{ matrix.platform }}-${{ matrix.arch }}
          path: sykli-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sykli-*
          merge-multiple: true
      - run: sha256sum sykli-*.tar.gz > SHA256SUMS
      # A Homebrew formula over the same tarballs, so a tap is one file away:
      # `false-systems/homebrew-tap` holding Formula/sykli.rb copied from this
      # release. The tap is an org decision; the formula ships regardless.
      - name: Generate Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          sum() { grep "  sykli-$TAG-$1.tar.gz\$" SHA256SUMS | cut -d' ' -f1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          cat > sykli.rb <<FORMULA
          class Sykli < Formula
            desc "Content-addressed evaluator for declared work graphs"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "$version"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$base/sykli-$TAG-macos-aarch64.tar.gz"
                sha256 "$(sum macos-aarch64)"
              else
                url "$base/sykli-$TAG-macos-x86_64.tar.gz"
                sha256 "$(sum macos-x86_64)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$base/sykli-$TAG-linux-aarch64.tar.gz"
                sha256 "$(sum linux-aarch64)"
              else
                url "$base/sykli-$TAG-linux-x86_64.tar.gz"
                sha256 "$(sum linux-x86_64)"
              end
            end

            def install
              bin.install "sykli"
            end

            test do
              assert_match "sykli", shell_output("#{bin}/sykli --version")
            end
          end
          FORMULA
          grep -c 'sha256 ""' sykli.rb && { echo "a tarball is missing from SHA256SUMS" >&2; exit 1; } || true
          cat sykli.rb
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            sykli-*.tar.gz
            SHA256SUMS
            sykli.rb

  # Container images, cross-compiled from the Dockerfile: `ghcr.io/<repo>:<tag>`
  # is the static binary on scratch; `<tag>-tools` adds git and jq for CI.
  image:
    needs: guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the binary image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sykli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Push the tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-tools
            ghcr.io/${{ github.repository }}:tools
