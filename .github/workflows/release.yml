name: Release guard

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo test --workspace --release --locked
      - run: cargo build --release --locked
      - run: cargo publish --package sykli --dry-run --locked
