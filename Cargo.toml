[package]
name = "sykli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Executes declared graphs and proves what ran"
license = "MIT"
repository = "https://github.com/false-systems/sykli"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
