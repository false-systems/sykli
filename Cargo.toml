[package]
name = "sykli"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Content-addressed evaluator for declared work graphs"
license = "MIT"
repository = "https://github.com/false-systems/sykli"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
